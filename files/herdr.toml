# herdr — terminal workspace manager for AI coding agents
# Symlinked to ~/.config/herdr/config.toml (see `make herdr`)
# Full reference: herdr --default-config
# Reload without restart: herdr server reload-config (or prefix+shift+r)

# Show first-run notification setup on startup.
onboarding = false

[theme]
# catppuccin, terminal, tokyo-night, dracula, nord, gruvbox,
# one-dark, solarized, kanagawa, rose-pine, vesper
name = "gruvbox"
# Follow host terminal light/dark appearance.
auto_switch = false
# dark_name = "gruvbox"
# light_name = "catppuccin-latte"

[terminal]
# Empty means $SHELL, then /bin/sh.
# default_shell = ""
# "auto" | "login" | "non_login"
shell_mode = "auto"
# CWD for new panes/tabs/workspaces: "follow" | "home" | "current" | fixed path
new_cwd = "follow"

[update]
# "stable" | "preview"
channel = "stable"
version_check = true
manifest_check = true

[keys]
# Prefix key, same as tmux (C-Space).
prefix = "ctrl+space"

# Prefix-mode actions (defaults kept explicit for discoverability).
# help = "prefix+?"
# settings = "prefix+s"
# detach = "prefix+q"
# reload_config = "prefix+shift+r"
# workspace_picker = "prefix+w"
# goto = "prefix+g"
# new_workspace = "prefix+shift+n"
# new_worktree = "prefix+shift+g"
# new_tab = "prefix+c"
# previous_tab = "prefix+p"
# next_tab = "prefix+n"
# switch_tab = "prefix+1..9"
# close_tab = "prefix+shift+x"
# split_vertical = "prefix+v"
# split_horizontal = "prefix+minus"
# close_pane = "prefix+x"
# zoom = "prefix+z"
# resize_mode = "prefix+r"
# toggle_sidebar = "prefix+b"

# Vim-style pane navigation (same as the tmux config).
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

# Popup command example: lazygit over the current layout.
# [[keys.command]]
# key = "prefix+alt+g"
# type = "popup"
# command = "lazygit"
# width = "80%"
# height = "80%"

# [worktrees]
# directory = "~/.herdr/worktrees"

[ui]
sidebar_width = 26
# sidebar_start_collapsed = false
# sidebar_collapsed_mode = "compact"
mouse_capture = true
copy_on_select = true
confirm_close = true
pane_borders = true
pane_gaps = true
# Show detected agent labels in split pane borders.
show_agent_labels_on_pane_borders = true
# Hide the tab row when a workspace has exactly one tab.
hide_tab_bar_when_single_tab = false
# "spaces" (grouped by space) or "priority" (attention queue)
agent_panel_sort = "spaces"
# accent = "cyan"

[ui.toast]
# off | herdr | terminal | system
delivery = "system"
# delay_seconds = 1

[ui.sound]
enabled = true

[session]
# Resume agent panes into their native sessions after a server restart.
resume_agents_on_restore = true

[remote]
# Let herdr manage the ssh config used by `herdr --remote` (keepalive + multiplexing).
manage_ssh_config = true

[experimental]
# Allow launching herdr from inside a herdr-managed pane.
allow_nested = false
# Save recent pane screen history across full server restarts.
pane_history = false

[advanced]
# scrollback_limit_bytes = 10000000
