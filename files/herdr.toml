# herdr — terminal workspace manager for AI coding agents
# Symlinked to ~/.config/herdr/config.toml (see `make herdr`)
# Full reference: herdr --default-config
# Reload without restart: herdr server reload-config (or prefix+shift+r)

# Show first-run notification setup on startup.
onboarding = false

[theme]
# catppuccin, terminal, tokyo-night, dracula, nord, gruvbox,
# one-dark, solarized, kanagawa, rose-pine, vesper
name = "gruvbox"
# Follow host terminal light/dark appearance.
auto_switch = false
# dark_name = "gruvbox"
# light_name = "catppuccin-latte"

# Sidebar has no border of its own: it is separated from the pane area by
# panel_bg alone. The default is transparent, so it inherits the terminal
# background and the edge is invisible. Clearly darker than Ghostty's
# Gruvbox Dark background (#282828) so the sidebar reads as its own strip.
# accent draws the frame around the pane area, i.e. the visible edge between
# the sidebar and the workspace.
[theme.custom]
# The sidebar background is not exposed as a theme token in this build, so the
# only markers of where it ends are the tab bar (panel_bg) and the pane frame
# (accent). Both are set to stay visible against the gruvbox background.
# panel_bg was #3c3836, which is exactly gruvbox's surface0 — the background
# of the selected sidebar row. The highlight was being drawn, it just matched
# the panel behind it. Keep the two apart: panel_bg darker than Ghostty's
# #282828, surface0 clearly lighter so the active space/agent row reads as a bar.
panel_bg = "#1d2021"
surface0 = "#504945"
accent = "#fabd2f"
# surface1/overlay0 are the dim tokens: unfocused pane borders AND unfocused
# sidebar rows. Pushing them near `text` (#ebdbb2) made every agent row look
# equally bright, so the focused one stopped standing out. Keep them in
# gruvbox's mid range: visible as borders, clearly dimmer than a focused row.
surface1 = "#665c54"
overlay0 = "#7c6f64"

[terminal]
# Empty means $SHELL, then /bin/sh.
# default_shell = ""
# "auto" | "login" | "non_login"
shell_mode = "auto"
# CWD for new panes/tabs/workspaces: "follow" | "home" | "current" | fixed path
new_cwd = "follow"

[update]
# "stable" | "preview"
channel = "stable"
version_check = true
manifest_check = true

[keys]
# Prefix key, same as tmux (C-Space).
prefix = "ctrl+space"

# Prefix-mode actions (defaults kept explicit for discoverability).
# help = "prefix+?"
# settings = "prefix+s"
# detach = "prefix+q"
# reload_config = "prefix+shift+r"
# workspace_picker = "prefix+w"
# goto = "prefix+g"
# new_workspace = "prefix+shift+n"
# new_worktree = "prefix+shift+g"
# new_tab = "prefix+c"
# previous_tab = "prefix+p"
# next_tab = "prefix+n"
# switch_tab = "prefix+1..9"
# close_tab = "prefix+shift+x"
# split_vertical = "prefix+v"
# split_horizontal = "prefix+minus"
# close_pane = "prefix+x"
# zoom = "prefix+z"
# resize_mode = "prefix+r"
# toggle_sidebar = "prefix+b"

# Vim-style pane navigation (same as the tmux config).
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

# Indexed jumps: workspaces (spaces) and agent rows.
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

# Navigate mode (prefix+g): explicit bindings instead of relying on defaults.
goto = "prefix+g"
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# prefix+shift+l: clear the focused pane by sending ctrl+l to it.
[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "herdr pane send-keys \"$(herdr pane current | grep -o '\"pane_id\":\"[^\"]*\"' | cut -d'\"' -f4)\" ctrl+l"

# Popup command example: lazygit over the current layout.
# [[keys.command]]
# key = "prefix+alt+g"
# type = "popup"
# command = "lazygit"
# width = "80%"
# height = "80%"

# --- Plugin actions (herdr plugin install ...) ---

# vim-herdr-navigation: ctrl+h/j/k/l across herdr panes and vim/nvim splits.
# Editor side still needs editor/nvim.lua from the plugin repo. Requires jq.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# herdr-file-viewer: git-aware read-only file viewer.
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"

# reviewr: review the agent's diff beside the chat.
[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr pane"

# [worktrees]
# directory = "~/.herdr/worktrees"

[ui]
sidebar_width = 26
# sidebar_start_collapsed = false
# sidebar_collapsed_mode = "compact"
mouse_capture = true
copy_on_select = true
# Force a repaint when a pane regains focus: clears prompt redraw leftovers
# after resizing a split.
redraw_on_focus_gained = true
confirm_close = true
pane_borders = true
pane_gaps = true
# Show detected agent labels in split pane borders.
show_agent_labels_on_pane_borders = true
# Hide the tab row when a workspace has exactly one tab.
hide_tab_bar_when_single_tab = false
# "spaces" (grouped by space) or "priority" (attention queue)
agent_panel_sort = "spaces"
# accent = "cyan"

# Sidebar agent rows. The default second row is "agent", which is always
# "claude" here and tells nothing apart. terminal_title_stripped is the task
# title Claude Code reports, so rows become distinguishable at a glance.
# No explicit fg/bold on tokens: omitted style fields keep the contextual
# default, which is what dims unfocused rows and highlights the active one.
[ui.sidebar.agents]
row_gap = 1
# $focus is a custom metadata token set by files/herdr-focus-marker.py: this
# build has no built-in focus indicator for agent rows, so the daemon marks the
# focused pane and the sidebar renders the marker here. Kept last in the row so
# the marker never shifts the text of the rows that carry it.
# pane distinguishes two agents sharing one tab in a split, where workspace+tab
# are identical. agent is kept in the second row: useless when every pane runs
# claude, essential as soon as codex or another CLI joins the session.
rows = [
  ["state_icon", "workspace", "tab", "pane", { token = "$focus", fg = "#fabd2f", bold = true }],
  # Explicit fg on these two: the contextual default renders them with the dim
  # token, which is too faint at this contrast. state_text is dropped — the
  # icon in row 1 already carries the same state.
  [{ token = "agent", fg = "#bdae93" }],
  [{ token = "terminal_title_stripped", fg = "#d5c4a1" }],
]

# Same marker for spaces: the built-in cue is bold text only.
[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace", { token = "$focus", fg = "#fabd2f", bold = true }],
  ["branch", "git_status"],
]

[ui.toast]
# off | herdr | terminal | system
delivery = "system"
# delay_seconds = 1

[ui.sound]
enabled = true
# macOS system sounds converted to mp3 at half volume (see files/sounds/).
# Absolute paths: relative ones resolve against the config file's directory,
# and this config is reached through a symlink.
# Soft click when an agent finishes, low tone when one needs attention.
done_path = "/Users/romodanov.d/dotfiles/files/sounds/tink.mp3"
request_path = "/Users/romodanov.d/dotfiles/files/sounds/submarine.mp3"

[session]
# Resume agent panes into their native sessions after a server restart.
resume_agents_on_restore = true

[remote]
# Let herdr manage the ssh config used by `herdr --remote` (keepalive + multiplexing).
manage_ssh_config = true

[experimental]
# Allow launching herdr from inside a herdr-managed pane.
allow_nested = false
# Save recent pane screen history across full server restarts.
pane_history = false

[advanced]
# scrollback_limit_bytes = 10000000
